repos:
  # All hooks use language: system — no network download required.
  # ruff only: mypy was removed — its baseline had 300+ pre-existing errors
  # (incl. vendored abacuslite), so it blocked every commit. Run `mypy` manually
  # if you want type checking after the codebase is cleaned up.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff (format)
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
